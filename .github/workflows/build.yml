name: Build

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'kakakakacat/KiliKili') || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: 验证 Android 签名校验脚本
              run: python3 -m unittest discover -s tool -p test_android_signing.py

            # 验证包固定用 CI 身份；带 tag 的正式包只能用单独的发布身份。
            - name: 配置 Android 验证签名
              if: github.event.inputs.tag == ''
              env:
                  ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_CI_KEYSTORE_BASE64 }}
                  ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_CI_STORE_PASSWORD }}
                  ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
                  ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
                  ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_CI_CERT_SHA256 }}
              run: python3 tool/android-signing.py configure

            - name: 配置 Android 发布签名
              if: github.event.inputs.tag != ''
              env:
                  ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                  ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
              run: python3 tool/android-signing.py configure

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Validation Apk
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}
              run: flutter build apk --release --split-per-abi --android-project-arg dev=1 --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

            - name: 核对 Android APK 签名
              env:
                  ANDROID_SIGNING_CERT_SHA256: ${{ github.event.inputs.tag != '' && vars.ANDROID_RELEASE_CERT_SHA256 || vars.ANDROID_CI_CERT_SHA256 }}
                  ANDROID_EXPECTED_PACKAGE: ${{ github.event.inputs.tag != '' && 'io.github.kakacat.kilikili' || 'io.github.kakacat.kilikili.dev' }}
              run: python3 tool/android-signing.py verify build/app/outputs/flutter-apk/app-*-release.apk

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "KiliKili_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: KiliKili_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: KiliKili_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: KiliKili_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: KiliKili_android_*_x86_64.apk

    ios:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'kakakakacat/KiliKili') || github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        # 发布签名的 secret 要显式传进去：可复用工作流默认拿不到调用方的
        # secrets，少了这一行，签名步骤会在 Secrets 配好之后依然静默跳过。
        secrets: inherit
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: ${{ github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        # 发布签名的 secret 要显式传进去：可复用工作流默认拿不到调用方的
        # secrets，少了这一行，签名步骤会在 Secrets 配好之后依然静默跳过。
        secrets: inherit
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'kakakakacat/KiliKili') || github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        # 发布签名的 secret 要显式传进去：可复用工作流默认拿不到调用方的
        # secrets，少了这一行，签名步骤会在 Secrets 配好之后依然静默跳过。
        secrets: inherit
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        # 发布签名的 secret 要显式传进去：可复用工作流默认拿不到调用方的
        # secrets，少了这一行，签名步骤会在 Secrets 配好之后依然静默跳过。
        secrets: inherit
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
