name: Regression CI

on:
  # 2026-11-12 起曾暂停 PR 上的回归检查（issue #114），分两步恢复：
  # 2026-11-27 恢复 `pull_request:` 触发，2026-11-28 在 PR #309 / #310 上看到
  # `regression gate` 真的报过绿之后，才把 ruleset「main regression gate」改回
  # active。顺序不能反：ruleset 一旦 active 而检查报不上来，所有 PR 会卡在
  # BLOCKED 永久合不进去——这也是 2026-11-12 当初必须两处一起关的原因。
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      full_platforms:
        description: Build all desktop and mobile packages as well
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 三条可复用工作流均运行；按路径过滤会让 fixture/工作流改动缺少必需状态。
  rust:
    name: Rust checks and golden fixtures
    uses: ./.github/workflows/rust.yml

  flutter:
    name: Dart baseline and real FFI
    uses: ./.github/workflows/flutter-test.yml

  proto:
    name: Protobuf descriptor consistency
    uses: ./.github/workflows/proto.yml

  android:
    name: Android package and native library
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-package

      - name: Prepare patched Flutter SDK and packages
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          tool/prepare-build.sh android

      - name: Test Android signing verification
        run: python3 -m unittest discover -s tool -p test_android_signing.py

      - name: Configure stable Android validation signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_CI_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_CI_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_CI_CERT_SHA256 }}
        run: python3 tool/android-signing.py configure

      - name: Build signed development APKs
        run: flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

      - name: Verify development APK signing
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_CI_CERT_SHA256 }}
          ANDROID_EXPECTED_PACKAGE: io.github.kakacat.kilikili.dev
        run: python3 tool/android-signing.py verify build/app/outputs/flutter-apk/app-*-release.apk

      - name: Inspect packaged Rust library
        shell: bash
        run: |
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*arm64-v8a*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one arm64-v8a APK, found ${#apks[@]}" >&2
            exit 1
          fi
          python3 tool/inspect-artifact.py "${apks[0]}" \
            --require lib/arm64-v8a/libbridge_flutter.so

  # The existing package workflows are expensive; run them automatically each
  # night, or explicitly with full_platforms. They compile packages but do
  # not claim to test hardware decoding, PiP, or background playback.
  ios:
    if: github.event_name == 'schedule' || inputs.full_platforms
    uses: ./.github/workflows/ios.yml
  macos:
    if: github.event_name == 'schedule' || inputs.full_platforms
    uses: ./.github/workflows/mac.yml
  windows:
    if: github.event_name == 'schedule' || inputs.full_platforms
    uses: ./.github/workflows/win_x64.yml
  linux:
    if: github.event_name == 'schedule' || inputs.full_platforms
    uses: ./.github/workflows/linux_x64.yml

  gate:
    name: regression gate
    if: always()
    needs: [rust, flutter, proto, android, ios, macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      RUST_RESULT: ${{ needs.rust.result }}
      PROTO_RESULT: ${{ needs.proto.result }}
      FLUTTER_RESULT: ${{ needs.flutter.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
      IOS_RESULT: ${{ needs.ios.result }}
      MACOS_RESULT: ${{ needs.macos.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      LINUX_RESULT: ${{ needs.linux.result }}
      FULL_PLATFORMS: ${{ github.event_name == 'schedule' || inputs.full_platforms }}
    steps:
      - name: Require every scheduled check to pass
        shell: bash
        run: |
          set -euo pipefail
          for result in "$RUST_RESULT" "$FLUTTER_RESULT" "$PROTO_RESULT" "$ANDROID_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "Required PR check ended with: $result" >&2
              exit 1
            fi
          done
          if [[ "$FULL_PLATFORMS" != true ]]; then
            exit 0
          fi
          # 平台打包这四项只把 failure 判红（issue #181）。托管 macOS runner 容量
          # 紧张时 job 会在 15 分钟整处结束：steps 为空、日志拉不到、注解写着
          # "The job was not acquired by Runner of type hosted even after multiple
          # attempts"——那不是构建失败，是根本没开始跑。
          #
          # 注意这里的值：运行页与 Jobs API 把那种 job 显示成 conclusion
          # "cancelled"，但 needs.<job>.result 给的是 **abandoned**。照着页面写
          # cancelled 是不管用的（第一版就这么错过一次，见 #181 下的复盘）。
          # 两个值都放过，但注解分开写，免得把「没抢到机器」和「有人按了取消」
          # 混成一句。代价：手动取消的那次也会被放过。
          platform_failed=0
          for entry in "ios:$IOS_RESULT" "macos:$MACOS_RESULT" \
                       "windows:$WINDOWS_RESULT" "linux:$LINUX_RESULT"; do
            platform="${entry%%:*}"
            result="${entry#*:}"
            case "$result" in
              success) ;;
              abandoned)
                echo "::warning title=Platform package never started::${platform} never acquired a hosted runner (result: abandoned), so it was not treated as a failure. This is runner capacity, not your change; see issue #181."
                echo "- :warning: \`${platform}\` abandoned (no runner acquired), not treated as a failure (issue #181)" >> "$GITHUB_STEP_SUMMARY"
                ;;
              cancelled)
                echo "::warning title=Platform package cancelled::${platform} was cancelled, so it was not treated as a failure. Someone cancelled this run, or a newer run superseded it (concurrency cancel-in-progress). It did not produce a package; see issue #181."
                echo "- :warning: \`${platform}\` cancelled, not treated as a failure (issue #181)" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "::error title=Platform package failed::${platform} ended with: ${result}"
                platform_failed=1
                ;;
            esac
          done
          if (( platform_failed )); then
            echo "Required platform build failed" >&2
            exit 1
          fi
