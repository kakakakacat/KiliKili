name: Regression CI

on:
  pull_request:
  push:
    # chore/readme-stats 是 readme-stats.yml 的固定分支。它开的 PR 由
    # GITHUB_TOKEN 创建，不会触发 pull_request 事件（GitHub 防递归），
    # 所以必须在这里对该分支的推送触发一次，PR 上才有 regression gate
    # 这个必过检查，auto-merge 才能完成。
    branches: [main, chore/readme-stats]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      full_platforms:
        description: Build all desktop and mobile packages as well
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both reusable workflows always run. Path filtering here would leave a
  # required check absent on some PRs, including fixture and workflow edits.
  rust:
    name: Rust checks and golden fixtures
    uses: ./.github/workflows/rust.yml

  flutter:
    name: Dart baseline and real FFI
    uses: ./.github/workflows/flutter-test.yml

  android:
    name: Android package and native library
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-package

      - name: Prepare patched Flutter SDK and packages
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          tool/prepare-build.sh android

      - name: Build unsigned development APKs
        run: flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

      - name: Inspect packaged Rust library
        shell: bash
        run: |
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*arm64-v8a*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one arm64-v8a APK, found ${#apks[@]}" >&2
            exit 1
          fi
          python3 tool/inspect-artifact.py "${apks[0]}" \
            --require lib/arm64-v8a/libbridge_flutter.so

  # The existing package workflows are expensive; run them automatically each
  # night, or explicitly with full_platforms. They compile packages but do
  # not claim to test hardware decoding, PiP, or background playback.
  ios:
    if: github.event_name == 'schedule' || inputs.full_platforms
    uses: ./.github/workflows/ios.yml
  macos:
    if: github.event_name == 'schedule' || inputs.full_platforms
    uses: ./.github/workflows/mac.yml
  windows:
    if: github.event_name == 'schedule' || inputs.full_platforms
    uses: ./.github/workflows/win_x64.yml
  linux:
    if: github.event_name == 'schedule' || inputs.full_platforms
    uses: ./.github/workflows/linux_x64.yml

  gate:
    name: regression gate
    if: always()
    needs: [rust, flutter, android, ios, macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      RUST_RESULT: ${{ needs.rust.result }}
      FLUTTER_RESULT: ${{ needs.flutter.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
      IOS_RESULT: ${{ needs.ios.result }}
      MACOS_RESULT: ${{ needs.macos.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      LINUX_RESULT: ${{ needs.linux.result }}
      FULL_PLATFORMS: ${{ github.event_name == 'schedule' || inputs.full_platforms }}
    steps:
      - name: Require every scheduled check to pass
        shell: bash
        run: |
          set -euo pipefail
          for result in "$RUST_RESULT" "$FLUTTER_RESULT" "$ANDROID_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "Required PR check ended with: $result" >&2
              exit 1
            fi
          done
          if [[ "$FULL_PLATFORMS" == true ]]; then
            for result in "$IOS_RESULT" "$MACOS_RESULT" "$WINDOWS_RESULT" "$LINUX_RESULT"; do
              if [[ "$result" != success ]]; then
                echo "Required platform build ended with: $result" >&2
                exit 1
              fi
            done
          fi
