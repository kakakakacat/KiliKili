name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      # iOS 是五端里唯一「仓库侧没有发布身份」的平台，这是结论不是遗漏
      # （#121，决策与理由见 docs/release/SIGNING.md §iOS）：
      #
      # 分发方式是侧载（AltStore / Sideloadly / TrollStore 等），最终签名由
      # **使用者自己的 Apple ID** 在本机完成，签名身份也因此属于使用者。
      # 仓库这边就算买了开发者账号，也只能签出 ad-hoc（要逐台登记 UDID）
      # 或企业证书（与本项目的分发方式不符）的包——都不是能复用给所有人的
      # 发布身份。所以这里产出的是**故意未签名**的 IPA。
      #
      # 下面那行 `codesign --sign -` 是 ad-hoc 签名，不是发布签名：它只给
      # 框架写一个占位签名，让侧载工具重签时不出错。
      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          ln -sf ./build/ios/iphoneos Payload
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 KiliKili_ios_${{env.file_version}}.ipa Payload/Runner.app

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            KiliKili_ios_*.ipa

      # 带 tag 的发布包已经进了上面的 Release。public 仓库的 Release 附件不计入
      # Actions 存储，产物那份却是计费的——同一个包存两遍，#279 的 4.87 GB 就是
      # 这么堆起来的，堆满之后 GitHub 会账号级停掉整个仓库的 Actions。
      # retention-days 比仓库默认的 7 天更短：验证包看完即弃。
      - name: Upload ios release
        if: ${{ inputs.tag == '' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release
          path: KiliKili_ios_*.ipa
          retention-days: 2
