name: Build for Linux x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-linux-app:
    name: Release Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.1 libasound2-dev libmpv-dev elfutils
        shell: bash

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Linux

        #TODO: deb and rpm packages need to be build
      - name: Build Linux
        run: flutter build linux --release --dart-define-from-file=pili_release.json --no-pub

      - name: Package .tar.gz
        run: tar -zcvf KiliKili_linux_${{ env.version }}_amd64.tar.gz -C build/linux/x64/release/bundle .

      - name: Packege deb
        run: |
          printf "建立构建目录...\n"
          mkdir "KiliKili_linux_${{ env.version }}_amd64"
          pushd "KiliKili_linux_${{ env.version }}_amd64"
          mkdir -p opt/KiliKili
          mkdir -p usr/share/applications
          mkdir -p usr/share/icons/hicolor/512x512/apps

          printf "复制文件...\n"
          cp -r ../build/linux/x64/release/bundle/* opt/KiliKili
          cp -r ../assets/linux/DEBIAN .
          cp ../assets/linux/io.github.kakacat.kilikili.desktop usr/share/applications
          cp ../assets/images/logo/logo.png usr/share/icons/hicolor/512x512/apps/kilikili.png

          printf "修改控制文件...\n"
          # 替换版本号
          sed -i  "2s/version_need_change/${{ env.version }}/g" DEBIAN/control
          # 计算安装大小并替换
          SIZE_KB=$(du -s -b --apparent-size . | awk '{print int($1)}')
          SIZE_KB=$(($SIZE_KB - $(du -s -b --apparent-size DEBIAN | awk '{print int($1)}')))
          SIZE_KB=$(echo $SIZE_KB | awk '{print int($1/1024 + 0.999)}')
          printf "\t安装大小: %s KB\n" "$SIZE_KB"
          sed -i "9s/size_need_change/${SIZE_KB}/g" DEBIAN/control

          printf "生成并写入 md5sums ...\n"
          md5sum opt/KiliKili/kilikili >> DEBIAN/md5sums
          md5sum opt/KiliKili/lib/* >> DEBIAN/md5sums
          md5sum opt/KiliKili/data/icudtl.dat >> DEBIAN/md5sums

          printf "设置权限...\n"
          chmod 0644 DEBIAN/control
          chmod 0644 DEBIAN/md5sums
          chmod 0755 DEBIAN/postinst
          chmod 0755 DEBIAN/postrm
          chmod 0755 DEBIAN/prerm

          printf "生成运行时依赖...\n"
          # 依赖不再手写，由 dpkg-shlibdeps 从 ELF 扫描生成。
          #
          # 手写列表会漂：2026-11-10 发现 deb 少声明了 webkit2gtk 与 libsoup3，
          # 缺了它们应用根本起不来（DT_NEEDED，加载期解析）。同一份 bundle 打出的
          # rpm 没有这个问题，因为 rpmbuild 本来就从 ELF 自动生成 Requires。
          # 见 issue #36 / PR #38。
          #
          # debian/control 是 dpkg-shlibdeps 的硬性要求；它必须在打包前删掉，
          # 否则会被 dpkg-deb 当作普通内容一起打进去。
          mkdir -p debian
          printf "Source: kilikili\n\nPackage: kilikili\nArchitecture: amd64\n" > debian/control
          #
          # 预期告警：dpkg-shlibdeps 会就 libflutter_linux_gtk.so 的 $ORIGIN
          # RPATH 报 6 次 warning。它按自己的规则找「包构建树根」，与这里的
          # 目录布局对不上。不影响结果：下面的 -l 已把产物自带的 lib 目录加入
          # 搜索路径，且生成的依赖经与独立的 DT_NEEDED 清单逐条核对，31 个
          # 外部 SONAME 全部有对应包声明，无遗漏。
          # libdartjni.so 需要 libjvm.so，桌面系统不提供它，扫描会让整步失败
          SCAN_LIBS=$(find opt/KiliKili/lib -name '*.so' ! -name 'libdartjni.so' | sort)
          SHLIBDEPS=$(dpkg-shlibdeps -O --ignore-missing-info -l"$PWD/opt/KiliKili/lib" opt/KiliKili/kilikili $SCAN_LIBS)
          rm -rf debian
          DEPENDS=$(printf '%s\n' "$SHLIBDEPS" | sed -n 's/^shlibs:Depends=//p')
          if [ -z "$DEPENDS" ]; then
            printf "dpkg-shlibdeps 没有产出任何依赖\n"
            printf "原始输出: %s\n" "$SHLIBDEPS"
            exit 1
          fi
          printf "生成的依赖: %s\n" "$DEPENDS"
          # 关键库必须在内，否则说明扫描漏了。用子串而非包名全等匹配：
          # Ubuntu 的 t64 过渡会把包名改成 libgtk-3-0t64 这类，写死全名
          # 会在下一次这种过渡里变成假失败。
          for token in gtk-3 mpv webkit2gtk soup; do
            case "$DEPENDS" in
              *"$token"*) ;;
              *)
                printf "生成的依赖里没有 %s，扫描可能不完整\n" "$token"
                exit 1
                ;;
            esac
          done
          printf 'Depends: %s\n' "$DEPENDS" >> DEBIAN/control

          printf "打包 deb 文件...\n"
          popd
          dpkg-deb --build --verbose --root-owner-group "KiliKili_linux_${{ env.version }}_amd64"
          printf "完成: KiliKili_linux_%s_amd64.deb\n" "${{ env.version }}"
        shell: bash

      - name: Packege rpm
        run: |
          printf "建立 RPM 构建目录...\n"
          RPM_BUILD_ROOT="$PWD/rpm_build"
          mkdir -p "$RPM_BUILD_ROOT/BUILD" "$RPM_BUILD_ROOT/RPMS" "$RPM_BUILD_ROOT/SOURCES" "$RPM_BUILD_ROOT/SPECS" "$RPM_BUILD_ROOT/SRPMS"

          printf "准备源码归档（仅包含运行时与元数据）...\n"
          DATE="$(date '+%a %b %d %Y')"
          SRC_DIR="$PWD/kilikili-${{ env.version }}"
          mkdir -p "$SRC_DIR/bundle" "$SRC_DIR/assets"
          cp -r build/linux/x64/release/bundle/* "$SRC_DIR/bundle/"
          cp assets/linux/io.github.kakacat.kilikili.desktop "$SRC_DIR/assets/io.github.kakacat.kilikili.desktop"
          cp assets/images/logo/logo.png "$SRC_DIR/assets/kilikili.png"
          tar -zcvf "$RPM_BUILD_ROOT/SOURCES/kilikili-${{ env.version }}.tar.gz" -C "$PWD" "kilikili-${{ env.version }}"

          printf "生成 spec 文件...\n"
          cat > "$RPM_BUILD_ROOT/SPECS/kilikili.spec" <<EOF
          # 不产出 debuginfo 子包。Flutter 的 bundle 不经过 rpmbuild 的编译流程，
          # 拆出来的符号没有使用场景，却会让 RPMS/ 下出现第二个 .rpm，而下面的
          # 选包逻辑必须是确定的。deb / AppImage / tar.gz 同样不剥离符号。
          %global debug_package %{nil}

          Name:           kilikili
          Version:        ${{ env.version }}
          Release:        1%{?dist}
          Summary:        KiliKili Linux Version
          License:        GPL-3.0
          Source0:        kilikili-${{ env.version }}.tar.gz
          Requires:       desktop-file-utils, hicolor-icon-theme

          %description
          使用 Flutter 开发的 BiliBili 第三方客户端

          %prep
          %setup -q -n kilikili-${{ env.version }}

          %build

          %install
          mkdir -p %{buildroot}/opt/KiliKili
          cp -r bundle/* %{buildroot}/opt/KiliKili/

          # 二进制权限与命令行入口
          chmod 755 %{buildroot}/opt/KiliKili/kilikili
          mkdir -p %{buildroot}/usr/bin
          ln -sf /opt/KiliKili/kilikili %{buildroot}/usr/bin/kilikili

          # 桌面集成
          mkdir -p %{buildroot}/usr/share/applications
          install -m 644 assets/io.github.kakacat.kilikili.desktop %{buildroot}/usr/share/applications/io.github.kakacat.kilikili.desktop

          mkdir -p %{buildroot}/usr/share/icons/hicolor/512x512/apps
          install -m 644 assets/kilikili.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/kilikili.png

          %post
          update-desktop-database -q || true
          gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor || true

          %postun
          update-desktop-database -q || true
          gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor || true

          %files
          /opt/KiliKili
          /usr/bin/kilikili
          /usr/share/applications/io.github.kakacat.kilikili.desktop
          /usr/share/icons/hicolor/512x512/apps/kilikili.png

          %changelog
          * DATE - ${{ env.version }}-1
          - Initial RPM release
          EOF

          sed -i "s/DATE/${DATE}/g" "$RPM_BUILD_ROOT/SPECS/kilikili.spec"

          printf "构建 RPM 包...\n"
          rpmbuild --define "_topdir $RPM_BUILD_ROOT" -bb "$RPM_BUILD_ROOT/SPECS/kilikili.spec"

          printf "选择主包...\n"
          # 原先是 find ... -exec mv {} <固定文件名> \;，对每个匹配各执行一次 mv，
          # 后找到的会静默覆盖先找到的。装了 elfutils 之后 rpmbuild 会额外产出
          # kilikili-debuginfo-*.rpm，于是发布的 RPM 成了只含调试符号的 11KB
          # 空壳，而构建依旧是绿的。显式选包 + 数量校验，不再依赖 find 的顺序。
          TARGET="KiliKili_linux_${{ env.version }}_amd64.rpm"
          mapfile -t RPM_FILES < <(find "$RPM_BUILD_ROOT/RPMS" -type f -name 'kilikili-*.rpm' \
            ! -name '*-debuginfo-*' ! -name '*-debugsource-*' | sort)
          if [ "${#RPM_FILES[@]}" -ne 1 ]; then
            printf "期望恰好 1 个主包，实际 %d 个\n" "${#RPM_FILES[@]}"
            printf "RPMS/ 下的全部 .rpm：\n"
            find "$RPM_BUILD_ROOT/RPMS" -type f -name '*.rpm' -print
            exit 1
          fi
          mv "${RPM_FILES[0]}" "$TARGET"

          # 体积闸门：主包应与 deb 同量级（约 18MB）。只含元数据或符号的包会
          # 远小于此。这一条正是上述 bug 当初能溜过 CI 的原因。
          RPM_SIZE="$(stat -c%s "$TARGET")"
          printf "RPM 体积: %s 字节\n" "$RPM_SIZE"
          if [ "$RPM_SIZE" -lt 10000000 ]; then
            printf "RPM 体积异常偏小，包内容很可能不完整。内含文件：\n"
            rpm -qlp "$TARGET" || true
            exit 1
          fi

          printf "完成: %s\n" "$TARGET"
        shell: bash

      - name: Package AppImage
        run: |
          printf "下载 appimagetool...\n"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          printf "建立 AppDir 目录结构...\n"
          APPDIR="KiliKili.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          printf "复制应用文件...\n"
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"

          printf "复制桌面文件和图标...\n"
          cp assets/linux/io.github.kakacat.kilikili.desktop "$APPDIR/io.github.kakacat.kilikili.desktop"
          cp assets/linux/io.github.kakacat.kilikili.desktop "$APPDIR/usr/share/applications/io.github.kakacat.kilikili.desktop"
          cp assets/images/logo/logo.png "$APPDIR/kilikili.png"
          cp assets/images/logo/logo.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/kilikili.png"

          printf "创建 AppRun 启动脚本...\n"
          cat > "$APPDIR/AppRun" <<'APPRUN_EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/kilikili" "$@"
          APPRUN_EOF
          chmod +x "$APPDIR/AppRun"

          printf "修改桌面文件中的 Exec 路径...\n"
          sed -i 's|Exec=kilikili|Exec=kilikili|g' "$APPDIR/io.github.kakacat.kilikili.desktop"
          sed -i 's|Icon=kilikili|Icon=kilikili|g' "$APPDIR/io.github.kakacat.kilikili.desktop"

          printf "打包 AppImage...\n"
          ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" "KiliKili_linux_${{ env.version }}_amd64.AppImage"

          printf "完成: KiliKili_linux_%s_amd64.AppImage\n" "${{ env.version }}"
        shell: bash

      # 上传前统一核对产物体积。CI 的 status check 覆盖不到产物内容：
      # 打包步骤成功 ≠ 包里有应用。2026-11-10 发布的 RPM 是个 11KB 的
      # 调试符号包，构建全程是绿的（见 PR #34）。下限取实测值的一半左右，
      # 只拦「明显不是应用」的情况，不做精确断言。
      - name: 校验产物体积
        run: |
          fail=0
          check() {
            if [ ! -f "$1" ]; then
              printf "缺失: %s\n" "$1"
              fail=1
              return
            fi
            size="$(stat -c%s "$1")"
            if [ "$size" -lt "$2" ]; then
              printf "过小: %s = %s 字节，下限 %s\n" "$1" "$size" "$2"
              fail=1
            else
              printf "OK:   %s = %s 字节\n" "$1" "$size"
            fi
          }
          check "KiliKili_linux_${{ env.version }}_amd64.tar.gz"   10000000
          check "KiliKili_linux_${{ env.version }}_amd64.deb"       8000000
          check "KiliKili_linux_${{ env.version }}_amd64.rpm"      10000000
          check "KiliKili_linux_${{ env.version }}_amd64.AppImage" 10000000
          exit "$fail"
        shell: bash

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            KiliKili_linux_*.tar.gz
            KiliKili_linux_*.deb
            KiliKili_linux_*.rpm
            KiliKili_linux_*.AppImage

      - name: Upload linux targz package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Linux_targz_amd64_packege
          path: KiliKili_linux_*.tar.gz

      - name: Upload linux deb package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Linux_deb_amd64_package
          path: KiliKili_linux_*.deb

      - name: Upload linux rpm package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Linux_rpm_amd64_package
          path: KiliKili_linux_*.rpm

      - name: Upload linux AppImage package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Linux_AppImage_amd64_package
          path: KiliKili_linux_*.AppImage
