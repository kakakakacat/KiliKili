name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-mac-app:
    name: Release Mac
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: Build Mac
        run: flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Prepare Upload
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/KiliKili.app || true
        continue-on-error: true

      - name: Rename DMG
        run: mv KiliKili*.dmg KiliKili_macos_${{ env.version }}.dmg

      # 同 linux_x64.yml。这一步在 macOS 上尤其有意义：上面的 create-dmg
      # 同时带了 `|| true` 和 continue-on-error，失败不会让构建变红。
      - name: 校验产物体积
        run: |
          f="KiliKili_macos_${{ env.version }}.dmg"
          if [ ! -f "$f" ]; then
            printf "缺失: %s\n" "$f"
            exit 1
          fi
          size="$(stat -f%z "$f")"
          printf "%s = %s 字节\n" "$f" "$size"
          if [ "$size" -lt 25000000 ]; then
            printf "体积过小，dmg 很可能不完整\n"
            exit 1
          fi
        shell: bash

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            KiliKili_macos_*.dmg

      - name: Upload macos release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-release
          path: KiliKili_macos_*.dmg
