# 独立于上游的五个 Flutter workflow，避免同步上游时产生冲突。
# Rust 接入 Flutter 构建后再考虑是否合并（见 issue #5 / RUST-004）。
name: Rust

on:
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust.yml']
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml 决定版本与组件，此处不重复指定，
      # 避免两处版本定义漂移。
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # 无缓存时 Rust 全量编译会使构建时间失控（见 VALIDATION-CAPABILITY.md §2）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  # 交叉编译仅验证能否产出目标平台产物，不代表运行时正确。
  cross-build:
    name: cross-build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26,       target: aarch64-apple-darwin }
          - { os: macos-26,       target: aarch64-apple-ios }
          - { os: ubuntu-latest,  target: aarch64-linux-android }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # rustup target 只提供标准库，不提供链接器与 C 编译器。
      # FRB 依赖链含 C 代码（cc-rs），交叉编译到 Android 必须用 NDK 的
      # clang，否则报 `failed to find tool "aarch64-linux-android-clang"`。
      - name: Set up Android NDK
        if: endsWith(matrix.target, '-linux-android')
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          # 与项目 android/app/build.gradle.kts 使用的 NDK 保持一致
          ndk-version: r29
          local-cache: true

      - name: Configure Android toolchain
        if: endsWith(matrix.target, '-linux-android')
        shell: bash
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # minSdk 对应的 API level；clang 包装脚本按 <target><api>-clang 命名
          API=24
          case "${{ matrix.target }}" in
            aarch64-linux-android)   TRIPLE=aarch64-linux-android ;;
            armv7-linux-androideabi) TRIPLE=armv7a-linux-androideabi ;;
            x86_64-linux-android)    TRIPLE=x86_64-linux-android ;;
          esac
          VAR=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          {
            echo "CC_${{ matrix.target }}=$BIN/${TRIPLE}${API}-clang"
            echo "AR_${{ matrix.target }}=$BIN/llvm-ar"
            echo "CARGO_TARGET_${VAR}_LINKER=$BIN/${TRIPLE}${API}-clang"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release
