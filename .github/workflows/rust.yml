# 独立于上游的五个 Flutter workflow，避免同步上游时产生冲突。
# Rust 接入 Flutter 构建后再考虑是否合并（见 issue #5 / RUST-004）。
name: Rust

on:
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust.yml']
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml 决定版本与组件，此处不重复指定，
      # 避免两处版本定义漂移。
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # 无缓存时 Rust 全量编译会使构建时间失控（见 VALIDATION-CAPABILITY.md §2）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  # 交叉编译仅验证能否产出目标平台产物，不代表运行时正确。
  #
  # 每个 PR 只跑 x86_64 的 Linux 与 Windows：两者一分钟内结束、不排队，
  # 已足以答出「代码里有没有写死某个平台」这个交叉编译唯一能答的问题。
  #
  # Apple 与 Android 三个 target 移到手动触发（下面的 cross-build-dispatch），
  # 原因是收益与代价不成比例：
  #
  # - GitHub 的 macOS arm64 hosted runner 常年容量紧张。PR #41 上
  #   `aarch64-apple-darwin` 连续两次在 15 分钟后报 "The job was not acquired
  #   by Runner of type hosted"——job 根本没启动，那个红灯关于代码的信息量为零，
  #   却是整个 PR 唯一的红。这种红灯重复几次，就会训练出「红了也先合」的习惯，
  #   那比没有这个检查更糟。
  # - 平台级的断裂（链接器、NDK、cargokit 把 Rust 接进 app 构建）本来就不是
  #   `cargo build --target` 能发现的，要靠五个 app workflow，而它们一直是手动
  #   dispatch（见 docs/m0/VALIDATION-CAPABILITY.md §2.1）。
  #
  # rust-toolchain.toml 仍钉着七个 target，手动跑或本地跑的覆盖面不变。
  cross-build:
    name: cross-build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release

  # Apple 与 Android：只在手动 dispatch 时跑，理由见上。
  # 建议的使用时机：改动触及 FFI/桥接层、升级 FRB 或工具链、发版前。
  cross-build-dispatch:
    name: cross-build ${{ matrix.target }} (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26,      target: aarch64-apple-darwin }
          - { os: macos-26,      target: aarch64-apple-ios }
          - { os: ubuntu-latest, target: aarch64-linux-android }
    steps:
      - uses: actions/checkout@v5

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # rustup target 只提供标准库，不提供链接器与 C 编译器。
      # FRB 依赖链含 C 代码（cc-rs），交叉编译到 Android 必须用 NDK 的
      # clang，否则报 `failed to find tool "aarch64-linux-android-clang"`。
      - name: Set up Android NDK
        if: endsWith(matrix.target, '-linux-android')
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          # 与项目 android/app/build.gradle.kts 使用的 NDK 保持一致
          ndk-version: r29
          # 不缓存：local-cache 恢复出的 NDK 是残缺的——包装脚本
          # aarch64-linux-android24-clang 还在，它要调用的 bin/clang 本体却
          # 丢了，链接阶段报 `line 4: .../bin/clang: No such file or directory`。
          # 首次下载（缓存未命中）时一切正常，命中缓存后才失败，这使得故障
          # 只在第二次之后出现，很容易误判为代码问题。
          # 每次重新下载约耗时 1 分钟，换取可重复的构建。
          local-cache: false

      - name: Configure Android toolchain
        if: endsWith(matrix.target, '-linux-android')
        shell: bash
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # minSdk 对应的 API level；clang 包装脚本按 <target><api>-clang 命名
          API=24
          case "${{ matrix.target }}" in
            aarch64-linux-android)   TRIPLE=aarch64-linux-android ;;
            armv7-linux-androideabi) TRIPLE=armv7a-linux-androideabi ;;
            x86_64-linux-android)    TRIPLE=x86_64-linux-android ;;
          esac
          VAR=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          {
            echo "CC_${{ matrix.target }}=$BIN/${TRIPLE}${API}-clang"
            echo "AR_${{ matrix.target }}=$BIN/llvm-ar"
            echo "CARGO_TARGET_${VAR}_LINKER=$BIN/${TRIPLE}${API}-clang"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release
