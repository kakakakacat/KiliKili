name: Build for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Add fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Build Windows
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean

      - name: Prepare Upload
        run: |
          mkdir -p Release/KiliKili-Win
          mkdir -p KiliKili-Win-Setup
          mv build/windows/x64/runner/Release/* Release/KiliKili-Win/
          mv dist/**/*.exe KiliKili-Win-Setup/KiliKili_windows_${{env.version}}_x64_setup.exe

      - name: Compress
        run: |
          Compress-Archive -Path "Release/KiliKili-Win" -DestinationPath "KiliKili_windows_${{env.version}}_x64_portable.zip"
        shell: pwsh

      # 同 linux_x64.yml：上传前核对体积，防止产物成功上传但内容是错的。
      - name: 校验产物体积
        shell: pwsh
        run: |
          $fail = $false
          function Check($path, $min) {
            if (-not (Test-Path $path)) {
              Write-Host "缺失: $path"
              $script:fail = $true
              return
            }
            $size = (Get-Item $path).Length
            if ($size -lt $min) {
              Write-Host "过小: $path = $size 字节，下限 $min"
              $script:fail = $true
            } else {
              Write-Host "OK:   $path = $size 字节"
            }
          }
          Check "KiliKili_windows_${{env.version}}_x64_portable.zip" 20000000
          Check "KiliKili-Win-Setup/KiliKili_windows_${{env.version}}_x64_setup.exe" 15000000
          if ($fail) { exit 1 }

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            KiliKili_windows_*.zip
            KiliKili-Win-Setup/KiliKili_windows_*.exe

      - name: Upload windows file release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-file-x64-release
          path: KiliKili_windows_*.zip

      - name: Upload windows setup release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-setup-x64-release
          path: KiliKili-Win-Setup/KiliKili_windows_*.exe
