[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/kakakakacat/KiliKili"

[workspace.dependencies]
prost = "0.14"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls + webpki-roots：Android NDK 上不必备 OpenSSL，证书根也不依赖
# 各平台系统信任库的差异（五端行为一致比「跟随系统」更重要）。
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "http2",
    "gzip",
    "brotli",
    "charset",
] }
# 弹幕过滤规则来自用户配置，必须按条编译、失败即降级回 Dart
# （见 bili-danmaku::rule 与 ADR-010）。
regex = "1"
# CDN 选路要按 host/query 改写地址。reqwest 已经把它带进依赖树，
# 这里只是显式用上，不新增编译单元。
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# 业务代码中 unwrap/expect 会把可恢复错误变成崩溃
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
