[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/kakakakacat/KiliKili"

[workspace.dependencies]
thiserror = "2.0"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# 业务代码中 unwrap/expect 会把可恢复错误变成崩溃
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
