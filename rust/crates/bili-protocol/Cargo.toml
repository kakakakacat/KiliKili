[package]
name = "bili-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "易变协议：WBI 签名、风控参数、协议版本化。与 Domain 隔离（RFC-0001 §16.7）。"

[dependencies]
md-5 = "0.10"
percent-encoding = "2.3"
rand = { version = "0.9", optional = true }

[features]
# 默认提供基于系统随机源的 Entropy 实现。关掉它可以让本 crate 在没有
# 系统随机源的目标上编译（如纯 wasm 沙箱），此时由调用方自带实现。
default = ["system-entropy"]
system-entropy = ["dep:rand"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
