# 与 `rust/rust-toolchain.toml`、`spikes/slint-mpv`、`spikes/slint-ui` 同版本。
#
# 理由和那两个一样：工具链漂移会同时改掉优化行为和 clippy 结论，而这个
# spike 迟早要报性能数字，几个平台的记录必须用同一个 rustc 跑出来才可比。
#
# `aarch64-linux-android` 是 Android 那一轮要的（评估文档 §6 第 2 步）。
# 1.100.0 这个 toolchain 下它**已经装了**（slint-ui 先装的，rustup 的 target
# 按 toolchain 走、不按目录），列在这里只是让换机器的人不用自己猜。
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
targets = ["aarch64-linux-android"]
