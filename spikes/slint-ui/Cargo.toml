# SPIKE-003（issue #10）的实验台。见 README.md 与 docs/m0/spikes/。
#
# 和 `slint-mpv` 同样的理由**自成一个 workspace**：`rust.yml` 按 `rust/**`
# 触发，spike 要链 GPU 栈、要开窗口、要调系统的无障碍接口，进了那个
# workspace 等于给所有 CI 作业加一堆它们装不了的依赖。它是证据产出工具，
# Go/No-Go 结论下来之后可以整个删掉。
[workspace]

[package]
name = "slint-ui-spike"
version = "0.0.0"
edition = "2024"
# 两个 bin（实验台与对照程序 frame-floor）并存，不指定的话 `cargo run` 不知道
# 该跑哪个，README 里那行命令直接报错。2026-11-22 复跑 Windows 那一轮时才发现
# ——此前都是直接跑 target/release 下的 exe，没人走过 README 写的那条路。
default-run = "slint-ui-spike"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
# 列表里的每一行都来自**生产投影**：pb 字节 → `grpc_reply::project_main_list`
# → `ReplyEntity` → `reply_richtext::segment`。用假结构问不出「真实评论的
# 段数与配图能不能撑住 60fps」。密度（行数）是合成的，记录里会写明。
bili-api = { path = "../../rust/crates/bili-api" }
bili-domain = { path = "../../rust/crates/bili-domain" }
bili-grpc = { path = "../../rust/crates/bili-grpc" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
prost = "0.14"
serde_json = "1"
slint = "1.19"
# 实验记录 / 帧耗时与 CPU/RSS 采样 / GL 截图，与 SPIKE-001/002 共用同一份。
spike-harness = { path = "../spike-harness" }

[build-dependencies]
slint-build = "1.19"

[profile.release]
# 与 `rust/Cargo.toml` 的 release profile 对齐：报告里的数字要代表 Phase 2
# 的真实形态，不能用 dev 构建的数字。
opt-level = 3
lto = "thin"
codegen-units = 1

# Android 入口是 cdylib 里导出的 `android_main`，桌面照旧是 src/main.rs。
# 多留一个 rlib 是为了让 bin 直接链这个 lib——不留的话 `main.rs` 只能用
# `#[path]` 把模块再编一遍，两份目标文件的优化结果未必一致，而这个 spike
# 报的就是性能数字。
[lib]
name = "slint_ui_spike"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "slint-ui-spike"
path = "src/main.rs"

[target.'cfg(target_os = "android")'.dependencies]
# 与上面的 slint 同一个依赖，这里只追加 feature（cargo 对 feature 取并集）。
slint = { version = "1.19", features = ["backend-android-activity-06"] }
# Android 上没有终端：println 进不了 logcat，而记录的进度与失败原因必须能被
# `adb logcat -s kk-spike` 脚本化取走。
android_logger = "0.15"
log = "0.4"

# cargo-apk 用这一段生成 AndroidManifest 并打包。
[package.metadata.android]
package = "io.github.kakacat.kilikili.spike.ui"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

# 转屏不重建 activity：重建会让 `android_main` 重跑一遍，脚本化流程从头开始，
# 而记录里的分段时间轴就断了。真实应用也是自己处理这些变化的。
[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode|density"

[package.metadata.android.application]
label = "KiliKili SPIKE-003"
# 记录与截图写到外部数据目录，`adb pull` 不需要 run-as。
debuggable = true

# cargo-apk 的 release 包必须有 keystore，否则打到一半就停。指向 Android 的
# 标准调试 keystore（口令固定 android）：探针不对外分发，它要的是 release 的
# 优化等级，不是一个可发布的签名身份。正式签名的约定见 docs/release/SIGNING.md。
[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"
